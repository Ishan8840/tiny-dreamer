[project]
name = "tiny-dreamer"
version = "0.1.0"
description = "A compact JAX world model and imagination-trained actor–critic for MinAtar"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "flax>=0.12.8",
    "gymnasium>=1.1,<1.4",
    "gymnax==1.0.1",
    "jax>=0.10.2",
    "minatar>=1.0.15",
    "numpy>=1.26",
    "optax>=0.2.9",
]
